# DataFlow AgentTeams配置

# Claude API配置
claude:
  model: "claude-opus-5"
  max_tokens: 4096
  temperature: 1.0

# Agent特定配置（可覆盖全局配置）
# max_tokens 按各 Agent 实测输出量设置：截断会导致 JSON 不闭合，
# 上一次运行中 ResearchPlanner 在 4096 处被截断、PipelineBuilder 实际用了 12795。
agents:
  orchestrator:
    temperature: 0.3  # 主控需要确定性
  research_planner:
    max_tokens: 12000
    temperature: 0.4
  field_mapper:
    max_tokens: 12000
    temperature: 0.3
  pipeline_builder:
    max_tokens: 24000  # 990 行代码约需 13k tokens，留一倍余量
    temperature: 0.4
  validator:
    max_tokens: 12000
    temperature: 0.3
  reviewer:
    max_tokens: 10000
    temperature: 0.3

# 执行配置
execution:
  max_retries: 3
  retry_delay: 2.0     # seconds between attempts
  timeout: 900         # HTTP read timeout per agent call（长代码生成需要）
  max_context_chars: 60000  # 注入 prompt 的上游上下文上限
  max_repair_rounds: 2      # Validator fail → PipelineBuilder 修复轮数

# 证据存储
evidence_dir: "evidence"

# 质量门禁
quality:
  min_validator_score: 0.5  # 低于此分数直接拒绝

# 成本控制
cost:
  default_budget: 100.0  # USD
  warning_threshold: 0.8  # 警告阈值（预算的80%）

# 审批配置
approval:
  auto_approve_on:
    - risk: "low"
      validator_verdict: "pass"
    - risk: "medium"
      validator_verdict: "pass"
      max_cost_ratio: 0.5  # 成本不超过预算50%

  require_human_approval_on:
    - risk: "high"
    - risk: "critical"
    - has_pii: true
    - cost_over_budget: 0.8

# MCP工具配置（可选）
mcp:
  enabled: false
  tools:
    schema_registry:
      endpoint: "http://localhost:8001"
    dataflow_api:
      endpoint: "http://localhost:8002"
    rag_knowledge:
      endpoint: "http://localhost:8003"
